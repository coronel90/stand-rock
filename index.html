<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stand Rock — recorrido 3D</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:#f4f4f4;font-family:Arial,Helvetica,sans-serif}
header{padding:22px 24px;text-align:center}
h1{margin:0 0 8px;font-size:clamp(22px,4vw,36px);letter-spacing:.08em;text-transform:uppercase}
p{margin:0;color:#c9c9c9;font-size:14px}
.viewer{height:calc(100vh - 112px);min-height:420px;width:100%;background:radial-gradient(circle at center,#333,#111 72%)}
model-viewer{width:100%;height:100%;--poster-color:transparent}
.hint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222d;color:#fff;border:1px solid #6668;border-radius:24px;padding:10px 16px;font-size:12px;white-space:nowrap;pointer-events:none}
</style>
</head>
<body>
<header>
<h1>Stand Rock</h1>
<p>Explorá el proyecto en 3D · Arrastrá para girar · Usá la rueda para acercar</p>
</header>
<div class="viewer">
<model-viewer src="Stand_ROCK.glb" alt="Modelo 3D del Stand Rock"
camera-controls touch-action="pan-y" interaction-prompt="auto"
shadow-intensity="1" exposure="1" environment-image="neutral"
auto-rotate auto-rotate-delay="2500" rotation-per-second="12deg"
>
</model-viewer>
</div>
<div class="hint">Arrastrá para girar · Scroll para zoom</div>
</body>
</html>
